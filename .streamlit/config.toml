# .streamlit/config.toml
# Phase DO-002 — localhost-only operator console defaults.
# Do not expose the dashboard on the LAN. Do not store passwords here.

[server]
address = "127.0.0.1"
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"

[runner]
fastReruns = true

# Phase readiness — hide Streamlit's automatic pages/ multipage nav so the
# Command Center Destination radio remains the single authoritative navigation.
# Does not hide the sidebar itself; does not remove pages/ files or routes.
[client]
showSidebarNavigation = false

# UI-A2 — official Streamlit theme. primaryColor is informational blue so
# navigation and period radios are not red. Red remains Streamlit's error color
# and our own blocked/negative tokens. Do not set a production-facing port here
# for isolated preview; launchers pass --server.port explicitly.
[theme]
base = "dark"
primaryColor = "#4EA1FF"
backgroundColor = "#0B0F14"
secondaryBackgroundColor = "#11171F"
textColor = "#E7ECF3"

name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    permissions: read-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (optional)
        run: |
          sudo apt-get update -y
          # add any system packages your pipeline needs here (e.g., libpq-dev)

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          # developer deps
          pip install pytest
          if [ -f "requirements-dev.txt" ]; then pip install -r requirements-dev.txt; fi
        env:
          PIP_NO_CACHE_DIR: "off"

      - name: Show environment (debug)
        run: |
          python -V
          pip -V
          pip list

      - name: Run tests
        run: |
          pytest -q

      - name: Run fast adaptive-engine smoke test (dev mode)
        run: |
          # run the in-process adaptive engine only (fast, no subprocesses)
          python run_adaptive_pipeline.py --skip-subprocesses || true

      - name: Upload results artifacts (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triton-results
          path: |
            data/results/**/*
            data/results || true

      - name: Print brief summary of results (if present)
        if: always()
        run: |
          echo "=== results files ==="
          ls -la data/results || echo "no results dir"

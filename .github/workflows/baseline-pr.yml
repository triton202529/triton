name: baseline-pr

on:
  schedule:
    - cron: "0 13 * * 1-5"   # Weekdays 09:00 ET
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/baseline-pr.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: baseline-pr
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  register:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "registering baseline-pr on push"

  rebuild-and-pr:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Versions
        run: |
          python - <<'PY'
          import sys, numpy, pandas, requests
          print("PY:", sys.version.replace("\n"," "))
          print("numpy:", numpy.__version__)
          print("pandas:", pandas.__version__)
          print("requests:", requests.__version__)
          PY

      - name: Download universe CSV from baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wf=".github/workflows/baseline.yml"
          rid="$(gh run list --workflow "$wf" --json databaseId,status,conclusion,createdAt \
                 --jq '[.[] | select(.status=="completed" and .conclusion=="success")][0].databaseId' | tr -d '\r\n')"
          echo "==> Baseline RID: ${rid:-<none>}"
          if [[ -z "${rid:-}" || "${rid}" == "null" ]]; then
            echo "::error::No successful baseline run found"; exit 1
          fi
          gh run download "$rid" --name universe-csv -D .
          mkdir -p data/results
          # artifact contains market_by_ticker.csv at root
          mv market_by_ticker.csv data/results/market_by_ticker.csv
          ls -al data/results/market_by_ticker.csv

      - name: Check data prerequisites
        id: data
        run: |
          set -euo pipefail
          if [[ -f data/results/market_by_ticker.csv ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Universe CSV not found: data/results/market_by_ticker.csv"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build baseline
        if: ${{ steps.data.outputs.ok == 'true' }}
        run: >
          python scripts/build_baseline.py
          --method cap --top 20
          --max-weight 0.125 --min-weight 0.0005
          --fund-whitelist BITO GBTC GLD ARKK DIA DBA
          --turnover-cap 0.05

      - name: Validate
        if: ${{ steps.data.outputs.ok == 'true' }}
        run: python scripts/validate_baseline.py --path data/results/baseline/weights.csv

      - name: Audit + enforce thresholds
        if: ${{ steps.data.outputs.ok == 'true' }}
        run: |
          set -euo pipefail
          python scripts/audit_baseline.py --path data/results/baseline/weights.csv --top 10 | tee audit.txt
          python scripts/audit_enforce.py --path data/results/baseline/weights.csv \
            --max-weight 0.1251 --min-weight 0.0005 --max-hhi 0.1005 --min-entropy 2.45 --min-effn 10.0

      # Use PowerShell audit to generate SUMMARY.md and a CSV diff for the PR body
      - name: Audit baseline & prepare PR body
        if: ${{ steps.data.outputs.ok == 'true' }}
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          $out = "out/audit"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          ./scripts/Invoke-BaselineAudit.ps1 `
            -Path "data/results/baseline/weights.csv" `
            -BaseRef "origin/main" `
            -TopN 20 `
            -OutDir $out
          Copy-Item "$out/SUMMARY.md" PR_BODY.md
          # Also publish in the Job Summary
          $summary = Get-Content -Raw PR_BODY.md
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

      - name: Create PR
        if: ${{ steps.data.outputs.ok == 'true' }}
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Baseline: auto-rebuild"
          branch: "ci/baseline-${{ github.run_id }}"
          commit-message: "baseline: auto-update"
          add-paths: |
            data/results/baseline/weights.csv
          body-path: PR_BODY.md
          labels: |
            baseline
            automerge
          delete-branch: true

      - name: Enable auto-merge
        if: ${{ steps.data.outputs.ok == 'true' && steps.cpr.outputs.pull-request-number != '' }}
        continue-on-error: true
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: baseline-pr-assets
          path: |
            data/results/baseline/weights.csv
            audit.txt
            out/audit/SUMMARY.md
            out/audit/baseline_diff.csv
            out/audit/weights_prev.csv
            out/audit/weights_new.csv
          if-no-files-found: warn

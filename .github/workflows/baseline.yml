name: baseline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekdays at 13:00 UTC
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

jobs:
  build-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner & Python versions
        run: |
          uname -a || true
          which python3 || true
          python3 --version || true
          python -V || true
          pip --version || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python - <<'PY'
          import sys, numpy, pandas, requests
          print("PY:", sys.version.replace("\n"," "))
          print("numpy:", numpy.__version__)
          print("pandas:", pandas.__version__)
          print("requests:", requests.__version__)
          PY

      - name: Sanity checks (git dir, required files)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test -f scripts/build_baseline.py
          test -f scripts/validate_baseline.py
          test -f scripts/audit_baseline.py
          echo "repo OK"

      - name: Build baseline (capture preview)
        run: >
          python scripts/build_baseline.py
          --method cap --top 20
          --max-weight 0.125 --min-weight 0.0005
          --fund-whitelist BITO GBTC GLD ARKK DIA DBA
          --turnover-cap 0.05 --dry-run
          | tee baseline_preview.txt

      - name: Validate last committed weights
        run: python scripts/validate_baseline.py --path data/results/baseline/weights.csv

      - name: Audit summary (human-friendly)
        run: python scripts/audit_baseline.py --path data/results/baseline/weights.csv --top 10

      - name: Enforce audit thresholds (CI gate)
        run: >
          python scripts/audit_enforce.py
          --path data/results/baseline/weights.csv
          --max-weight 0.1251
          --min-weight 0.0005
          --max-hhi 0.1005
          --min-entropy 2.45
          --min-effn 10.0

      # Publish the current universe file so baseline-pr can consume it
      - name: Upload universe CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-csv
          path: data/results/market_by_ticker.csv
          if-no-files-found: warn

      - name: Upload preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-preview
          path: baseline_preview.txt

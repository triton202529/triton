name: baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 13 * * 1-5" # Weekdays at 13:00 UTC
  workflow_dispatch:

jobs:
  build-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show lib versions
        run: |
          python - <<'PY'
          import sys, numpy, pandas
          print("Python:", sys.version.replace("\n"," "))
          print("NumPy :", numpy.__version__)
          print("Pandas:", pandas.__version__)
          PY

      - name: Build baseline (capture preview)
        run: >
          python scripts/build_baseline.py
          --method cap --top 20
          --max-weight 0.125 --min-weight 0.0005
          --fund-whitelist BITO GBTC GLD ARKK DIA DBA
          --turnover-cap 0.05 --dry-run
          | tee baseline_preview.txt

      - name: Validate last committed weights
        run: python scripts/validate_baseline.py --path data/results/baseline/weights.csv

      - name: Audit summary (human-friendly)
        run: python scripts/audit_baseline.py --path data/results/baseline/weights.csv --top 10

      - name: Enforce audit thresholds (CI gate)
        run: >
          python scripts/audit_enforce.py
          --path data/results/baseline/weights.csv
          --max 0.1251
          --min 0.0005
          --hhi-max 0.1005
          --entropy-min 2.45
          --eff-n-min 10.0

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseline-preview
          path: baseline_preview.txt

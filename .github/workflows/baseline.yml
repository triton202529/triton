jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # prevent git 128 “unsafe repo” annoyances
      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -V
          pip -V
          pip install -r requirements.txt
          pip check || true   # show dependency issues without failing the job yet
          python - <<'PY'
          import sys, numpy as np, pandas as pd
          print("python:", sys.version.split()[0])
          print("numpy :", np.__version__)
          print("pandas:", pd.__version__)
          PY

      - name: Build baseline (capture preview)
        run: >
          python scripts/build_baseline.py
          --method cap --top 20
          --max-weight 0.125 --min-weight 0.0005
          --fund-whitelist BITO GBTC GLD ARKK DIA DBA
          --turnover-cap 0.05 --dry-run
          | tee baseline_preview.txt

      - name: Validate last committed weights
        run: python scripts/validate_baseline.py --path data/results/baseline/weights.csv

      - name: Audit summary (human-friendly)
        run: python scripts/audit_baseline.py --path data/results/baseline/weights.csv --top 10

      - name: Enforce audit thresholds (CI gate)
        run: >
          python scripts/audit_enforce.py
          --path data/results/baseline/weights.csv
          --max-weight 0.1251
          --min-weight 0.0005
          --max-hhi 0.1005
          --min-entropy 2.45
          --min-effn 10.0

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseline-preview
          path: baseline_preview.txt

name: baseline-pr

on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: baseline-pr
  cancel-in-progress: true

jobs:
  rebuild-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Versions
        run: |
          python - <<'PY'
          import sys, numpy, pandas, requests
          print("PY:", sys.version.replace("\n"," "))
          print("numpy:", numpy.__version__)
          print("pandas:", pandas.__version__)
          print("requests:", requests.__version__)
          PY

      - name: Save previous weights (if any)
        shell: bash
        run: |
          mkdir -p tmp
          test -f data/results/baseline/weights.csv && cp data/results/baseline/weights.csv tmp/prev_weights.csv || true

      - name: Build baseline
        run: >
          python scripts/build_baseline.py
          --method cap --top 20
          --max-weight 0.125 --min-weight 0.0005
          --fund-whitelist BITO GBTC GLD ARKK DIA DBA
          --turnover-cap 0.05

      - name: Validate
        run: python scripts/validate_baseline.py --path data/results/baseline/weights.csv

      - name: Audit + enforce thresholds
        shell: bash
        run: |
          python scripts/audit_baseline.py --path data/results/baseline/weights.csv --top 10 | tee audit.txt
          python scripts/audit_enforce.py --path data/results/baseline/weights.csv --max-weight 0.1251 --min-weight 0.0005 --max-hhi 0.1005 --min-entropy 2.45 --min-effn 10.0

      - name: Build diff markdown for PR
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd, pathlib
          from pathlib import Path
          prev_path = Path("tmp/prev_weights.csv")
          new = pd.read_csv("data/results/baseline/weights.csv")
          p = pd.read_csv(prev_path).set_index("ticker")["target_weight"] if prev_path.exists() else pd.Series(dtype=float)
          n = new.set_index("ticker")["target_weight"]
          all_t = sorted(set(p.index) | set(n.index))
          rows=[(t, float(p.get(t, 0.0)), float(n.get(t, 0.0))) for t in all_t]
          df = pd.DataFrame([(t,o,nw,nw-o) for t,o,nw in rows], columns=["ticker","old","new","delta"]).sort_values("delta", key=abs, ascending=False)
          df.to_csv("baseline_diff.csv", index=False, float_format="%.6f")
          top = df.head(20).copy()
          pct = lambda x: f"{x:.4%}"
          md = ["# Baseline auto-update","","## Top 20 weight changes","","| ticker | old | new | delta |","|---|---:|---:|---:|"]
          md += [f"| {r.ticker} | {pct(r.old)} | {pct(r.new)} | {pct(r.delta)} |" for _, r in top.iterrows()]
          pathlib.Path("PR_BODY.md").write_text("\n".join(md))
          PY

      - name: Create PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Baseline: auto-rebuild"
          branch: "ci/baseline-${{ github.run_id }}"
          commit-message: "baseline: auto-update"
          add-paths: |
            data/results/baseline/weights.csv
          body-path: PR_BODY.md
          labels: baseline, automerge
          delete-branch: true
          if-no-files-changed: skip

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-pr-assets
          path: |
            data/results/baseline/weights.csv
            baseline_diff.csv
            audit.txt
# noop
